# Desplegar funciones: las Edge Functions del motor (licitaciones-reciente,
# compra-agil-reciente, comprador-licitacion) a Supabase, sin el PC.
#
# QUÉ HACE
#
# Al subir cambios a main que toquen supabase/functions (o config.toml),
# despliega sólo las funciones que cambiaron. Si cambió algo de _shared,
# también las que lo usan (directa o indirectamente). verify_jwt sale de
# supabase/config.toml, igual que con la CLI en el PC (cambiar sólo
# config.toml no redespliega nada).
#
# También se corre a mano: Actions -> «Desplegar funciones» -> «Run workflow».
# En «funciones» se escriben los nombres separados por espacio, o «todas».
#
# SECRETO QUE NECESITA (Settings -> Secrets and variables -> Actions)
#
#   SUPABASE_ACCESS_TOKEN   un token personal de Supabase
#                           (supabase.com/dashboard/account/tokens)
#
# El repo es PÚBLICO: el secreto no lo ven los forks ni los pull requests de
# terceros (este workflow sólo corre con push a main o a mano), y los registros
# no lo muestran. Los secretos de las funciones (MP_TICKET, RESEND_API_KEY)
# viven en Supabase, no aquí.

name: Desplegar funciones

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      funciones:
        description: 'Cuáles, separadas por espacio, o «todas». Vacío = las que cambiaron en el último commit.'
        type: string
        default: ''

concurrency:
  group: funciones
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROYECTO: tbvqpsearfgazjnqvrng

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Elegir las funciones
        id: elegir
        env:
          PEDIDAS: ${{ inputs.funciones }}
          ANTES: ${{ github.event.before }}
        run: |
          cd supabase/functions
          TODAS=$(find . -mindepth 2 -maxdepth 2 -name index.ts | cut -d/ -f2 | grep -v '^_' | sort | tr '\n' ' ')
          if [ -n "$PEDIDAS" ]; then
            if [ "$PEDIDAS" = "todas" ]; then LISTA="$TODAS"; else LISTA="$PEDIDAS"; fi
          else
            if [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$ANTES" 2>/dev/null; then
              BASE="HEAD~1"
            else
              BASE="$ANTES"
            fi
            CAMBIOS=$(git diff --name-only "$BASE" HEAD -- . ../config.toml || true)
            LISTA=$(python3 - "$CAMBIOS" <<'PY'
          import os, re, sys
          cambios = [c for c in sys.argv[1].split('\n') if c.strip()]
          raiz = '.'
          funciones = sorted(d for d in os.listdir(raiz)
                             if not d.startswith('_') and os.path.isfile(os.path.join(raiz, d, 'index.ts')))
          # Un cambio sólo en config.toml no redespliega nada: verify_jwt se
          # aplica la próxima vez que se despliegue cada función.
          comp = set()
          elegidas = set()
          for c in cambios:
              partes = c.split('/')
              if 'functions' in partes:
                  partes = partes[partes.index('functions') + 1:]
              if not partes: continue
              if partes[0] == '_shared' and len(partes) > 1:
                  comp.add(partes[1])
              elif partes[0] in funciones:
                  elegidas.add(partes[0])
          def importa(texto, nombres):
              return any(re.search(r"['/]" + re.escape(n) + r"['\"]", texto) for n in nombres)
          # Lo de _shared que usa, directa o indirectamente, lo que cambió.
          dir_comp = os.path.join(raiz, '_shared')
          if comp and os.path.isdir(dir_comp):
              crece = True
              while crece:
                  crece = False
                  for f in os.listdir(dir_comp):
                      if f in comp: continue
                      t = open(os.path.join(dir_comp, f), encoding='utf-8', errors='ignore').read()
                      if importa(t, comp):
                          comp.add(f); crece = True
          if comp:
              for d in funciones:
                  for base, _, archivos in os.walk(os.path.join(raiz, d)):
                      for f in archivos:
                          if f.endswith(('.ts', '.tsx', '.js')):
                              t = open(os.path.join(base, f), encoding='utf-8', errors='ignore').read()
                              if importa(t, comp):
                                  elegidas.add(d)
          print(' '.join(sorted(elegidas)))
          PY
            )
          fi
          echo "Funciones: ${LISTA:-ninguna}"
          echo "lista=$LISTA" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.elegir.outputs.lista != ''
        with:
          version: latest

      - name: Desplegar
        if: steps.elegir.outputs.lista != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LISTA: ${{ steps.elegir.outputs.lista }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          FALLARON=""
          for f in $LISTA; do
            echo "::group::$f"
            if ! supabase functions deploy "$f" --project-ref "$PROYECTO" --use-api --yes; then
              FALLARON="$FALLARON $f"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FALLARON" ]; then
            echo "::error::No se desplegaron:$FALLARON"
            exit 1
          fi
          echo "Desplegadas: $LISTA"
