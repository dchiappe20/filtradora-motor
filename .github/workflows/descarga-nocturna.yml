name: Descarga nocturna Compra Ágil

# Barrido COMPLETO: recorre la ventana entera (DIAS_VENTANA = 30 días, día por
# día) y deja los datos en Supabase. Es el que pone al día todo lo que los
# barridos cortos del día no miran. La app sólo lee de la nube.
#
# Durante el día hay otro barrido, más corto: ver `compra-agil-diurno.yml`.
#
# ─────────────────────────────────────────────────────────────────────────────
# QUIÉN LO DISPARA A LA HORA (2026-09-03)
#
# Supabase, con pg_cron, llamando a la API de GitHub (ver
# `supabase/cron_barridos.sql`). El cron de aquí abajo quedó de RESPALDO.
#
# Medido sobre las corridas reales: desde el 27-08 este workflow arranca entre
# 4h20 y 6h25 tarde TODAS las noches (el 03-09 le tocaba a las 01:07 de Chile y
# salió a las 05:38). Y eso no es sólo impuntualidad: el barrido está pensado
# para la madrugada, cuando el portal responde bien y nadie está trabajando;
# corriendo a media mañana es lento y además pisa la jornada.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # RESPALDO. 05:07 UTC ≈ 01:07 (invierno) / 02:07 (verano) en Chile.
    - cron: '7 5 * * *'
  # A mano desde "Actions" -> "Run workflow", y camino del disparo puntual.
  workflow_dispatch: {}

permissions:
  # Sólo se clona el código: el token del job no necesita escribir en el repo.
  contents: read
  # Para preguntarle a la API si el disparo puntual ya hizo el barrido de esta
  # noche, y no repetirlo desde el respaldo.
  actions: read

jobs:
  descargar:
    runs-on: ubuntu-latest
    # GitHub mata cualquier trabajo a las 6 h (360 min) pase lo que pase: subir
    # este número más allá no sirve de nada. Por eso el corte de verdad lo pone
    # el script (LIMITE_MINUTOS['completo'] = 300 en barrido_compra_agil.py), que
    # se detiene solo tras guardar lo que lleve; esto es sólo la red de seguridad.
    #
    # De régimen el barrido baja las ~3.000 cotizaciones del día (~15-25 min). La
    # PRIMERA población son ~30.000 (varias horas a la velocidad que da el
    # portal), así que no cabe en una corrida: se completa sola en dos o tres
    # noches, porque lo descargado se guarda por lotes y la siguiente sigue donde
    # quedó.
    timeout-minutes: 350
    # Evita que dos barridos (éste, el diurno o uno manual) se pisen escribiendo
    # la tabla. El que llegue segundo espera a que termine el primero.
    concurrency:
      group: descarga-compra-agil
      cancel-in-progress: false
    env:
      ARCHIVO: descarga-nocturna.yml
    steps:
      - name: ¿Hace falta este respaldo?
        id: guardia
        env:
          GH_TOKEN: ${{ github.token }}
          CRON: ${{ github.event.schedule }}
          EVENTO: ${{ github.event_name }}
        run: |
          set -uo pipefail

          if [ "$EVENTO" != "schedule" ]; then
            echo "Disparo directo: se corre el barrido completo."
            echo "corre=si" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # El instante que le TOCABA a esta corrida, reconstruido desde el cron
          # que la disparó. No se mira el reloj: una corrida puede llegar horas
          # tarde y aun así se sabe de qué noche es.
          utc_m=$(echo "$CRON" | awk '{print $1}')
          utc_h=$(echo "$CRON" | awk '{print $2}')
          prog=$(date -u -d "$(date -u +%F) ${utc_h}:${utc_m}" +%s)
          ahora=$(date -u +%s)
          if [ "$prog" -gt "$ahora" ]; then
            prog=$(date -u -d "$(date -u -d yesterday +%F) ${utc_h}:${utc_m}" +%s)
          fi
          atraso=$(( (ahora - prog) / 60 ))
          desde=$(date -u -d "@$prog" +%Y-%m-%dT%H:%M:%SZ)
          echo "Le tocaba a las $desde; arrancó $atraso min tarde."

          ya=$(curl -sS --max-time 30 \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$ARCHIVO/runs?event=workflow_dispatch&created=%3E$desde&per_page=1" \
               | jq -r '.total_count')
          # Ante la duda se CORRE: perder una noche entera de barrido completo es
          # mucho peor que repetirlo.
          if ! echo "$ya" | grep -qE '^[0-9]+$'; then
            echo "No se pudo preguntar a la API si ya corrió: por si acaso, se corre."
            ya=0
          fi

          if [ "$ya" -gt 0 ]; then
            echo "Desde $desde ya hubo $ya corrida(s) por disparo puntual: este respaldo no hace falta."
            echo "corre=no" >> "$GITHUB_OUTPUT"
          else
            echo "Nadie hizo el barrido de esta noche: lo hace este respaldo."
            echo "corre=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Clonar repositorio
        if: steps.guardia.outputs.corre == 'si'
        uses: actions/checkout@v4

      - name: Preparar Python
        if: steps.guardia.outputs.corre == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias (solo lo que usa el runner)
        if: steps.guardia.outputs.corre == 'si'
        run: pip install -r requirements.txt

      - name: Ejecutar barrido completo
        if: steps.guardia.outputs.corre == 'si'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # service_role: el runner recorre las empresas de `core` (salta RLS) y
          # escribe en cada una. El código acota todo por empresa_id.
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # El runner corre en UTC; sin esto, «hoy» sería el día siguiente
          # durante toda la madrugada chilena y la ventana quedaría corrida.
          TZ: America/Santiago
        run: python barrido_compra_agil.py completo noche
