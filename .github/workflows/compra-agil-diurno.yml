name: Barridos diurnos Compra Ágil (10:00, 12:00 y 15:00 Chile)

# Barridos CORTOS, tres veces al día: listan SÓLO lo publicado hoy, para que las
# cotizaciones nuevas no esperen hasta la madrugada. No vuelven sobre los días
# anteriores.
#
# Cada hora es una RANURA, y el plan de cada empresa decide en cuáles se le
# filtra (ver RANURAS_POR_PLAN en barrido_compra_agil.py):
#
#   10:00  manana     |  planes de 3 barridos al día
#   12:00  mediodia   |  planes de 1 barrido al día
#   15:00  tarde      |  planes de 3 barridos al día
#
# La DESCARGA no se reparte: es una copia compartida y la leen todas las
# empresas, pague lo que pague cada una. Lo que el plan limita es el filtrado.
# Por eso la ranura del mediodía se salta entera si ningún cliente la tiene
# contratada: las de las 10:00 y las 15:00 ya cubren la descarga de ese día.
#
# De paso sueltan de la tabla lo que ya tiene el 2do cierre vencido, que se sabe
# con la fecha guardada sin preguntarle nada al portal.
#
# Todo lo que sí exige volver a mirar el portal —los pasos de 1er a 2do llamado
# y los cierres— es cosa del barrido COMPLETO de la madrugada
# (`descarga-nocturna.yml`), que recorre los 30 días de la ventana.
on:
  schedule:
    # El cron de GitHub SÓLO entiende UTC, y Chile cambia de huso dos veces al
    # año (UTC−4 en invierno, UTC−3 en verano). Por eso se programan las DOS
    # horas UTC posibles de cada barrido y el primer paso descarta la que no
    # corresponda según la hora real en Chile:
    #   13:00 UTC = 10:00 (verano) | 09:00 (invierno)
    #   14:00 UTC = 11:00 (verano) | 10:00 (invierno)
    #   15:00 UTC = 12:00 (verano) | 11:00 (invierno)
    #   16:00 UTC = 13:00 (verano) | 12:00 (invierno)
    #   18:00 UTC = 15:00 (verano) | 14:00 (invierno)
    #   19:00 UTC = 16:00 (verano) | 15:00 (invierno)
    # Las tres corridas que se descartan terminan en segundos y casi no gastan
    # minutos de Actions.
    #
    # El barrido de la tarde se adelantó de las 16:00 a las 15:00 para que sus
    # resultados estén disponibles antes de que termine la jornada.
    - cron: '0 13,14,15,16,18,19 * * *'
  # A mano desde "Actions" -> "Run workflow": corre siempre, sea la hora que sea.
  workflow_dispatch: {}

# El token automatico del job no necesita escribir nada en el repositorio: solo
# se clona el codigo. En un repositorio publico esto importa mas, porque cierra
# lo que un workflow comprometido podria hacer con el.
permissions:
  contents: read

jobs:
  descargar:
    runs-on: ubuntu-latest
    # Tiene que cubrir TODO lo que hace el job, no sólo la descarga:
    #
    #   descarga   100 min  (LIMITE_MINUTOS['dia'])
    #   filtrado     ~6 min  (~2 por empresa)
    #   seguimiento  55 min  (MINUTOS_SEGUIMIENTO['dia'])
    #   arranque      ~3 min  (checkout + pip)
    #   ------------------
    #                164 min
    #
    # Estaba en 120 y por eso el 2026-08-19 GitHub cortó la corrida en mitad del
    # seguimiento: la descarga sola ya se llevaba 100. Los dos cortes internos
    # del script paran antes que esto; el timeout es sólo la red de seguridad.
    timeout-minutes: 175
    # Mismo grupo que el barrido nocturno: dos barridos nunca escriben la tabla
    # a la vez. El que llegue segundo espera.
    concurrency:
      group: descarga-compra-agil
      cancel-in-progress: false
    env:
      # Todo el job razona en hora de Chile: el guardia de abajo y el propio
      # barrido (que necesita saber qué día es «hoy» allá).
      TZ: America/Santiago
    steps:
      - name: ¿Toca barrido a esta hora en Chile, y de qué ranura?
        id: horario
        run: |
          hora=$(date +%H)
          case "$hora" in
            10) ranura=manana ;;
            12) ranura=mediodia ;;
            15) ranura=tarde ;;
            *)  ranura= ;;
          esac
          if [ "${{ github.event_name }}" != "schedule" ]; then
            # A mano se filtra para TODAS: quien pulsa el botón quiere ver el
            # efecto ya, no acordarse de qué plan cae en qué hora.
            echo "Lanzado a mano (en Chile son las $hora): se corre para todas las empresas."
            echo "toca=si" >> "$GITHUB_OUTPUT"
            echo "ranura=todas" >> "$GITHUB_OUTPUT"
          elif [ -n "$ranura" ]; then
            echo "En Chile son las $hora: toca el barrido de la ranura '$ranura'."
            echo "toca=si" >> "$GITHUB_OUTPUT"
            echo "ranura=$ranura" >> "$GITHUB_OUTPUT"
          else
            echo "En Chile son las $hora: esta corrida es la del otro huso, se salta."
            echo "toca=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Clonar repositorio
        if: steps.horario.outputs.toca == 'si'
        uses: actions/checkout@v4

      - name: Preparar Python
        if: steps.horario.outputs.toca == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias (solo lo que usa el runner)
        if: steps.horario.outputs.toca == 'si'
        run: pip install -r requirements.txt

      - name: Ejecutar barrido del día
        if: steps.horario.outputs.toca == 'si'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # service_role: el runner recorre las empresas de `core` (salta RLS) y
          # escribe en cada una. El código acota todo por empresa_id.
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python barrido_compra_agil.py dia ${{ steps.horario.outputs.ranura }}
