name: Barrido diurno Compra Ágil (12:00 Chile)

# Barrido CORTO del mediodía: lista SÓLO lo publicado hoy, para que las
# cotizaciones nuevas no esperen hasta la madrugada. No vuelve sobre los días
# anteriores.
#
# Cada hora es una RANURA, y el plan de cada empresa decide en cuáles se le
# filtra (ver RANURAS_POR_PLAN en barrido_compra_agil.py):
#
#   10:00  manana     |  planes de 3 barridos al día
#   12:00  mediodia   |  TODOS los planes — es el único diurno vivo hoy
#   15:00  tarde      |  planes de 3 barridos al día
#
# La DESCARGA no se reparte: es una copia compartida y la leen todas las
# empresas, pague lo que pague cada una. Lo que el plan limita es el filtrado.
#
# De paso suelta de la tabla lo que ya tiene el 2do cierre vencido, que se sabe
# con la fecha guardada sin preguntarle nada al portal.
#
# Todo lo que sí exige volver a mirar el portal —los pasos de 1er a 2do llamado
# y los cierres— es cosa del barrido COMPLETO de la madrugada
# (`descarga-nocturna.yml`), que recorre los 30 días de la ventana.
#
# ─────────────────────────────────────────────────────────────────────────────
# QUIÉN LO DISPARA A LA HORA (2026-09-03)
#
# NO el cron de aquí abajo. Lo dispara Supabase, con pg_cron, llamando a la API
# de GitHub (ver `supabase/cron_barridos.sql`). El cron de GitHub queda de
# RESPALDO por si el de Supabase se cae.
#
# Por qué se le quitó el mando al cron de GitHub: medido sobre las corridas
# reales del repo, desde el 27-08 TODAS las programadas salen entre 2 y 12 horas
# tarde, todos los días y en los tres workflows (el nocturno llegó a salir 6h25
# tarde; los foros, 7h44). Las lanzadas a mano, en cambio, arrancan siempre en
# el mismo segundo en que se piden. El problema es la COLA de las programadas de
# GitHub, no el minuto elegido: correr el cron a un minuto no redondo se probó
# el 27-08 y no cambió nada.
#
# Y el atraso no era sólo un atraso: el guardia miraba el RELOJ, así que una
# corrida que llegaba a las 14:42 no veía las 12 y se descartaba en silencio.
# Las cinco últimas corridas programadas terminaron en 6 segundos sin bajar
# NADA. El barrido del mediodía llevaba días sin ocurrir salvo cuando se pulsaba
# el botón a mano.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # RESPALDO. El cron de GitHub sólo entiende UTC, y Chile cambia de huso dos
    # veces al año (UTC−4 en invierno, UTC−3 en verano), así que se programan las
    # DOS horas UTC posibles y el guardia descarta la que no corresponda:
    #   15:17 UTC = 12:17 (verano) | 11:17 (invierno)
    #   16:17 UTC = 13:17 (verano) | 12:17 (invierno)
    #
    # VAN EN DOS LÍNEAS SEPARADAS A PROPÓSITO: `github.event.schedule` devuelve
    # la expresión tal cual está escrita, así que con `17 15,16` las dos
    # corridas eran indistinguibles y no se podía saber cuál era la del mediodía.
    - cron: '17 15 * * *'
    - cron: '17 16 * * *'
  # A mano desde "Actions" -> "Run workflow", y también el camino por el que
  # entra el disparo puntual de Supabase: corre siempre, sea la hora que sea.
  workflow_dispatch:
    inputs:
      ranura:
        description: 'Ranura a correr'
        required: false
        default: todas
        type: choice
        options:
          - todas
          - manana
          - mediodia
          - tarde

permissions:
  # Sólo se clona el código: el token del job no necesita escribir en el repo.
  contents: read
  # Para preguntarle a la API si el disparo puntual de Supabase ya cubrió esta
  # ranura, y no repetir el barrido desde el respaldo.
  actions: read

jobs:
  descargar:
    runs-on: ubuntu-latest
    # Tiene que cubrir TODO lo que hace el job, no sólo la descarga:
    #
    #   descarga   100 min  (LIMITE_MINUTOS['dia'])
    #   filtrado     ~6 min  (~2 por empresa)
    #   seguimiento  55 min  (MINUTOS_SEGUIMIENTO['dia'])
    #   arranque      ~3 min  (checkout + pip)
    #   ------------------
    #                164 min
    #
    # Estaba en 120 y por eso el 2026-08-19 GitHub cortó la corrida en mitad del
    # seguimiento: la descarga sola ya se llevaba 100. Los dos cortes internos
    # del script paran antes que esto; el timeout es sólo la red de seguridad.
    timeout-minutes: 175
    # Mismo grupo que el barrido nocturno: dos barridos nunca escriben la tabla
    # a la vez. El que llegue segundo espera.
    concurrency:
      group: descarga-compra-agil
      cancel-in-progress: false
    env:
      # Todo el job razona en hora de Chile: el guardia de abajo y el propio
      # barrido (que necesita saber qué día es «hoy» allá).
      TZ: America/Santiago
      ARCHIVO: compra-agil-diurno.yml
    steps:
      - name: ¿Qué ranura es ésta, y hace falta correrla?
        id: horario
        env:
          GH_TOKEN: ${{ github.token }}
          CRON: ${{ github.event.schedule }}
          RANURA_PEDIDA: ${{ inputs.ranura }}
          EVENTO: ${{ github.event_name }}
        run: |
          set -uo pipefail

          # ── Disparo directo (Supabase o el botón): la ranura viene dicha ──
          if [ "$EVENTO" != "schedule" ]; then
            ranura="${RANURA_PEDIDA:-todas}"
            echo "Disparo directo: ranura '$ranura'. No se mira el reloj."
            echo "corre=si" >> "$GITHUB_OUTPUT"
            echo "ranura=$ranura" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Respaldo: la ranura sale de la hora PROGRAMADA, no del reloj ──
          #
          # Ésta es la corrección de fondo. Antes se leía `date +%H`, así que una
          # corrida que llegaba tarde se creía de otra hora y se descartaba en
          # silencio. Ahora se reconstruye el instante que le TOCABA a partir del
          # cron que la disparó, y ese instante no cambia por mucho que GitHub la
          # tenga horas en la cola.
          utc_m=$(echo "$CRON" | awk '{print $1}')
          utc_h=$(echo "$CRON" | awk '{print $2}')
          prog=$(date -u -d "$(date -u +%F) ${utc_h}:${utc_m}" +%s)
          ahora=$(date -u +%s)
          # Si el atraso cruzó la medianoche UTC, el instante programado es el de ayer.
          if [ "$prog" -gt "$ahora" ]; then
            prog=$(date -u -d "$(date -u -d yesterday +%F) ${utc_h}:${utc_m}" +%s)
          fi
          atraso=$(( (ahora - prog) / 60 ))
          hora=$(date -d "@$prog" +%H)   # TZ del job = America/Santiago
          echo "Cron '$CRON' -> le tocaba a las $hora en Chile; arrancó $atraso min tarde."

          case "$hora" in
            10) ranura=manana ;;
            12) ranura=mediodia ;;
            15) ranura=tarde ;;
            *)  ranura= ;;
          esac
          if [ -z "$ranura" ]; then
            echo "Esa hora no es de ninguna ranura: es la corrida del otro huso, se salta."
            echo "corre=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── ¿Ya lo hizo el disparo puntual de Supabase? ──
          #
          # Si desde que le tocaba a esta ranura ya hubo una corrida lanzada por
          # dispatch (Supabase o el botón), el barrido está hecho y este respaldo
          # sólo gastaría dos horas de runner repitiéndolo.
          desde=$(date -u -d "@$prog" +%Y-%m-%dT%H:%M:%SZ)
          ya=$(curl -sS --max-time 30 \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$ARCHIVO/runs?event=workflow_dispatch&created=%3E$desde&per_page=1" \
               | jq -r '.total_count')
          # Ante la duda (la API no contestó, jq no devolvió un número) se CORRE:
          # un barrido de más es caro, pero uno de menos deja a los clientes sin
          # las cotizaciones del día.
          if ! echo "$ya" | grep -qE '^[0-9]+$'; then
            echo "No se pudo preguntar a la API si ya corrió: por si acaso, se corre."
            ya=0
          fi

          if [ "$ya" -gt 0 ]; then
            echo "Desde $desde ya hubo $ya corrida(s) por disparo puntual: este respaldo no hace falta."
            echo "corre=no" >> "$GITHUB_OUTPUT"
          else
            echo "Nadie cubrió la ranura '$ranura': la corre este respaldo (con $atraso min de atraso)."
            echo "corre=si" >> "$GITHUB_OUTPUT"
            echo "ranura=$ranura" >> "$GITHUB_OUTPUT"
          fi

      - name: Clonar repositorio
        if: steps.horario.outputs.corre == 'si'
        uses: actions/checkout@v4

      - name: Preparar Python
        if: steps.horario.outputs.corre == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias (solo lo que usa el runner)
        if: steps.horario.outputs.corre == 'si'
        run: pip install -r requirements.txt

      - name: Ejecutar barrido del día
        if: steps.horario.outputs.corre == 'si'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # service_role: el runner recorre las empresas de `core` (salta RLS) y
          # escribe en cada una. El código acota todo por empresa_id.
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python barrido_compra_agil.py dia ${{ steps.horario.outputs.ranura }}
