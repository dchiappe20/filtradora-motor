name: Revisión nocturna Foros Inversos

# Revisa cada noche, POR EMPRESA, los foros de aclaración de sus licitaciones
# ofertadas (tabla foro_ofertadas): detecta menciones a la empresa y egresa las
# que superan 1 año o dejan de estar CERRADA. El ingreso de la lista es aparte.
#
# ─────────────────────────────────────────────────────────────────────────────
# QUIÉN LO DISPARA A LA HORA (2026-09-03)
#
# Supabase, con pg_cron, llamando a la API de GitHub (ver
# `supabase/cron_barridos.sql`). El cron de aquí abajo quedó de RESPALDO: desde
# el 27-08 arranca entre 4h y 7h44 tarde todas las noches.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # RESPALDO. 09:23 UTC ≈ 05:23 Chile (después del nocturno de Compra Ágil).
    - cron: '23 9 * * *'
  # A mano desde "Actions" -> "Run workflow", y camino del disparo puntual.
  workflow_dispatch: {}

permissions:
  # Sólo se clona el código: el token del job no necesita escribir en el repo.
  contents: read
  # Para preguntarle a la API si el disparo puntual ya hizo la revisión de esta
  # noche, y no repetirla desde el respaldo.
  actions: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: foros-nocturno
      cancel-in-progress: false
    env:
      ARCHIVO: foros-nocturno.yml
    steps:
      - name: ¿Hace falta este respaldo?
        id: guardia
        env:
          GH_TOKEN: ${{ github.token }}
          CRON: ${{ github.event.schedule }}
          EVENTO: ${{ github.event_name }}
        run: |
          set -uo pipefail

          if [ "$EVENTO" != "schedule" ]; then
            echo "Disparo directo: se corre la revisión."
            echo "corre=si" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # El instante que le TOCABA a esta corrida, reconstruido desde el cron
          # que la disparó (no desde el reloj, que con el atraso ya no dice nada).
          utc_m=$(echo "$CRON" | awk '{print $1}')
          utc_h=$(echo "$CRON" | awk '{print $2}')
          prog=$(date -u -d "$(date -u +%F) ${utc_h}:${utc_m}" +%s)
          ahora=$(date -u +%s)
          if [ "$prog" -gt "$ahora" ]; then
            prog=$(date -u -d "$(date -u -d yesterday +%F) ${utc_h}:${utc_m}" +%s)
          fi
          atraso=$(( (ahora - prog) / 60 ))
          nominal=$(date -u -d "@$prog" +%Y-%m-%dT%H:%M:%SZ)
          echo "Le tocaba a las $nominal; arrancó $atraso min tarde."

          # ¿Ya hizo el disparo puntual de Supabase la revisión de esta noche?
          #
          # LA VENTANA EMPIEZA 2 h ANTES DE LA HORA NOMINAL DEL CRON (2026-09-10).
          #
          # Buscando desde el instante exacto del cron no encontraba NUNCA nada,
          # y el respaldo repetía el barrido entero todos los días. El motivo: el
          # disparo puntual sale a la hora EN PUNTO de Chile y estos cron van a
          # minutos sueltos MÁS TARDE, así que el disparo caía siempre fuera de la
          # ventana por delante. Medido el 09-10: diurno 15:00:02 UTC contra un
          # cron de las 15:17 (17 min), nocturno 04:00:02 contra las 05:07 (67
          # min), foros 08:00:02 contra las 09:23 (83 min). Los dos últimos se
          # descuadran más en horario de verano, porque su cron tiene una sola
          # hora UTC y Chile se mueve. Dos horas cubre todos los casos y no llega
          # al disparo del día anterior, que está a 24 h.
          desde=$(date -u -d "@$((prog - 7200))" +%Y-%m-%dT%H:%M:%SZ)
          # Una corrida FALLIDA no cuenta como cubierta: si el disparo puntual se
          # cayó (pasó el 09-09), este respaldo tiene que hacer el trabajo. Las
          # que aún están corriendo (conclusion null) sí cuentan, o el respaldo se
          # pondría en cola detrás sólo para repetir lo mismo.
          ya=$(curl -sS --max-time 30 \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$ARCHIVO/runs?event=workflow_dispatch&created=%3E$desde&per_page=30" \
               | jq '[.workflow_runs[]
                      | select(.conclusion != "failure" and .conclusion != "cancelled")]
                     | length')
          # Ante la duda se CORRE: quedarse sin revisión es peor que repetirla.
          if ! echo "$ya" | grep -qE '^[0-9]+$'; then
            echo "No se pudo preguntar a la API si ya corrió: por si acaso, se corre."
            ya=0
          fi

          if [ "$ya" -gt 0 ]; then
            echo "Desde $desde ya hubo $ya corrida(s) por disparo puntual: este respaldo no hace falta."
            echo "corre=no" >> "$GITHUB_OUTPUT"
          else
            echo "Nadie revisó los foros esta noche: lo hace este respaldo."
            echo "corre=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Clonar repositorio
        if: steps.guardia.outputs.corre == 'si'
        uses: actions/checkout@v4

      - name: Preparar Python
        if: steps.guardia.outputs.corre == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        if: steps.guardia.outputs.corre == 'si'
        run: pip install -r requirements.txt

      - name: Ejecutar revisión de foros
        if: steps.guardia.outputs.corre == 'si'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # service_role: recorre empresas de `core` y escribe hallazgos (salta RLS).
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Tickets por empresa: se usan solo para consultar el ESTADO de cada
          # licitación (cerrada/adjudicada/...). El scraping del foro no usa ticket.
          MP_TICKET_AMILAB: ${{ secrets.MP_TICKET_AMILAB }}
          MP_TICKET_UTEM: ${{ secrets.MP_TICKET_UTEM }}
        run: python revisar_foros_nocturno.py
